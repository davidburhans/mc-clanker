# docker-compose.test.yml - Test environment with PostgreSQL
# Usage: docker-compose -f docker-compose.test.yml up -d
# Then run tests with: DATABASE_URL=postgresql://postgres:postgres@localhost:5432/mcclanker pytest tests/

services:
  postgres:
    image: postgres:15
    container_name: mcclanker-test-db
    environment:
      POSTGRES_DB: mcclanker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgtestdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgtestdata:
