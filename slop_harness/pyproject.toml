[project]
name = "slop-harness"
version = "0.1.0"
description = "Dataset generation harness for slop jockey fine-tuning"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "aiohttp>=3.9.0",
    "filelock>=3.13.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages.find = {where = ["."], include = ["slop_harness*"]}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
