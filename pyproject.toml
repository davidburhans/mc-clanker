[project]
name = "mc-clanker"
version = "0.1.0"
description = "AI-Powered Continuous Music Generator — a professional DJ-style interface for real-time music generation using Foundation-1"
readme = "README.md"
requires-python = ">=3.10"

# Core web-server dependencies (installed in all environments)
dependencies = [
  # Web framework
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "starlette>=0.35.0",

  # Database
  "sqlalchemy>=2.0.0",
  "psycopg2-binary>=2.9.0",

  # Async PostgreSQL (used by job_waiter, worker, onboarding)
  "asyncpg>=0.28.0",

  # Object storage
  "boto3>=1.34.0",
  "botocore>=1.34.0",

  # Auth
  "bcrypt>=4.0.0",
  "PyJWT>=2.8.0",

  # HTTP client (used by onboarding llm check)
  "httpx>=0.25.0",

  # Schema validation
  "pydantic[email]>=2.0.0",

  # OpenAI-compatible LLM client
  "openai>=1.0.0",

  # Audio/scientific
  # numpy>=1.26 is required: the old floor (1.23.5) imports the removed `distutils`
  # module and cannot build/install on Python 3.12+ (review finding F1/F2).
  "numpy>=1.26",
  "scipy>=1.12.0",
]

[dependency-groups]
# GPU worker process (needs torch + CUDA stack)
worker = [
  "torch>=2.0.0",
  "stable-audio-tools==0.0.19",
  "huggingface_hub>=0.20.0",
  "safetensors>=0.4.0",
]

# Development / testing
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.0.0",
  "pytest-mock>=3.10.0",
  "httpx>=0.25.0",
  "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Enforce E (pycodestyle) + F (pyflakes) plus the UP006/UP007/UP045 typing
# rules (E6 modernization, Phase 9). E + F debt was paid down in the E10-EF
# sweep (E501 wraps, F841 dead vars with side-effects preserved, E402
# intentional-import noqas, E401 split, F811 dedup). `I` (import sorting) still
# carries pre-existing debt and is deferred to its own commit.
select = ["E", "F", "UP006", "UP007", "UP045"]

[tool.pyright]
# Point Pyright (the LSP pi-lens uses) at the venv site-packages so third-party
# imports (pydantic, sqlalchemy, fastapi, boto3, ...) resolve. extraPaths is the
# robust choice for uv-managed venvs: it adds packages WITHOUT displacing
# Pyright's bundled typeshed stdlib (venv/venvPath caused 499 reportUndefinedVariable).
extraPaths = [".venv/lib/python3.12/site-packages"]
