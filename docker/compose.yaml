services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=mcclanker
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=mcclanker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcclanker"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  garage:
    image: debian-slim/garage:latest
    ports:
      - "3900:3900"
    volumes:
      - garage_data:/data
    command: server --data-dir /data --http-port 3900 --s3-port 3901
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3900/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: mcclanker/web:latest
    env_file:
      - ../.env
    ports:
      - "7860:7860"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY:-not-needed}
      - LLM_MODEL=${LLM_MODEL}
      - ICECAST_ENABLED=${ICECAST_ENABLED:-false}
      - EXPORT_DIR=/exports
      - DISABLE_LOCAL_AUDIO=1
      - DATABASE_URL=${DATABASE_URL:-postgresql://mcclanker:${POSTGRES_PASSWORD}@postgres:5432/mcclanker}
      - JWT_SECRET=${JWT_SECRET}
      - SHOWS_DIR=/exports/shows
      - GARAGE_ENDPOINT=${GARAGE_ENDPOINT}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY}
      - GARAGE_BUCKET=${GARAGE_BUCKET}
      - GARAGE_BUCKET_REGION=${GARAGE_BUCKET_REGION:-garage}
    volumes:
      - ../exports:/exports:rw
      - ../.env:/app/.env:rw
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: mcclanker/worker:latest
    env_file:
      - ../.env
    environment:
      - WORKER_ID=worker-${HOSTNAME:-1}
      - DATABASE_URL=${DATABASE_URL:-postgresql://mcclanker:${POSTGRES_PASSWORD}@postgres:5432/mcclanker}
      - GARAGE_ENDPOINT=${GARAGE_ENDPOINT}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY}
      - GARAGE_BUCKET=${GARAGE_BUCKET}
      - GARAGE_BUCKET_REGION=${GARAGE_BUCKET_REGION:-garage}
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface:rw
    devices:
      - nvidia.com/gpu=all
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    deploy:
      replicas: 3
    restart: unless-stopped

  # Optional Icecast server for streaming output
  # Uncomment to enable web streaming
  # icecast:
  #   image: insomniaicecast/icecast
  #   ports:
  #     - "8001:8000"
  #   environment:
  #     - ICECAST_SOURCE_PASSWORD=sourcepass
  #     - ICECAST_ADMIN_PASSWORD=adminpass
  #     - ICECAST_MAX_SOURCES=10

volumes:
  postgres_data:
  redis_data:
  garage_data:
