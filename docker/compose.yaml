services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=mcclanker
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=mcclanker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcclanker"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: docker.io/minio/minio:latest
    ports:
      - "3900:9000"
      - "3901:9001"
    environment:
      MINIO_ROOT_USER: ${GARAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${GARAGE_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: mcclanker/web:latest
    env_file:
      - ../.env
    ports:
      - "4400:4400"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-http://vllm:8000/v1}
      - LLM_API_KEY=${LLM_API_KEY:-not-needed}
      - LLM_MODEL=${LLM_MODEL:-McClanker}
      - ICECAST_ENABLED=${ICECAST_ENABLED:-false}
      - EXPORT_DIR=/exports
      - DISABLE_LOCAL_AUDIO=1
      - DATABASE_URL=${DATABASE_URL:-postgresql://mcclanker:${POSTGRES_PASSWORD}@postgres:5432/mcclanker}
      - JWT_SECRET=${JWT_SECRET}
      - SHOWS_DIR=/exports/shows
      - GARAGE_ENDPOINT=${GARAGE_ENDPOINT}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY}
      - GARAGE_BUCKET=${GARAGE_BUCKET}
      - GARAGE_BUCKET_REGION=${GARAGE_BUCKET_REGION:-garage}
    volumes:
      - ../exports:/exports:rw
      - ../.env:/app/.env:rw
      - ../app:/app/app:rw
      - ../config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: mcclanker/worker:latest
    env_file:
      - ../.env
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - WORKER_ID=worker-${HOSTNAME:-1}
      - DATABASE_URL=${DATABASE_URL:-postgresql://mcclanker:${POSTGRES_PASSWORD}@postgres:5432/mcclanker}
      - GARAGE_ENDPOINT=${GARAGE_ENDPOINT}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY}
      - GARAGE_BUCKET=${GARAGE_BUCKET}
      - GARAGE_BUCKET_REGION=${GARAGE_BUCKET_REGION:-garage}
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface:rw
    devices:
      - nvidia.com/gpu=all
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
