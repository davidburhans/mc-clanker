services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=mcclanker
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=mcclanker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcclanker"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: docker.io/minio/minio:latest
    ports:
      - "3900:9000"
      - "3901:9001"
    environment:
      MINIO_ROOT_USER: ${GARAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${GARAGE_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: mcclanker/web:latest
    env_file:
      - ../.env
    ports:
      - "0.0.0.0:4400:4400"
    environment:
      # LLM endpoint — point LLM_BASE_URL (in .env) at your OpenAI-compatible server.
      # Common defaults: LM Studio http://localhost:1234/v1, Ollama http://localhost:11434/v1,
      # vLLM http://localhost:8001/v1. NOTE: no `vllm` service ships in this compose file,
      # so the previous default (http://vllm:8000/v1) was unreachable out-of-the-box (review F8).
      - LLM_BASE_URL=${LLM_BASE_URL:-http://localhost:1234/v1}
      - LLM_API_KEY=${LLM_API_KEY:-not-needed}
      - LLM_MODEL=${LLM_MODEL:-McClanker}
      - ICECAST_ENABLED=${ICECAST_ENABLED:-false}
      - EXPORT_DIR=/exports
      - DISABLE_LOCAL_AUDIO=1
      - DATABASE_URL=${DATABASE_URL:-postgresql://mcclanker:${POSTGRES_PASSWORD}@postgres:5432/mcclanker}
      - JWT_SECRET=${JWT_SECRET}
      - SHOWS_DIR=/exports/shows
      - GARAGE_ENDPOINT=${GARAGE_ENDPOINT}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY}
      - GARAGE_BUCKET=${GARAGE_BUCKET}
      - GARAGE_BUCKET_REGION=${GARAGE_BUCKET_REGION:-garage}
    volumes:
      - ../exports:/exports:rw
      - ../.env:/app/.env:rw
      - ../app:/app/app:rw
      - ../config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  cleanup:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: mcclanker/web:latest
    # Dedicated storage-retention service (REL-05/REL-16): must keep running
    # while the GPU worker is down circuit-broken (invariant 5), and the worker
    # stays decoupled from audio storage. Runs the same app.cleanup module the
    # worker's in-process loop uses; here the retention envs default ON.
    command: ["/app/.venv/bin/python", "-m", "app.cleanup"]
    # Review round-1 (P2): this image's Dockerfile HEALTHCHECK probes
    # http://localhost:4400/api/health/ready, which this batch command never
    # serves — without disabling it the container is reported unhealthy forever.
    healthcheck:
      disable: true
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://mcclanker:${POSTGRES_PASSWORD}@postgres:5432/mcclanker}
      - GARAGE_ENDPOINT=${GARAGE_ENDPOINT}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY}
      - GARAGE_BUCKET=${GARAGE_BUCKET}
      - GARAGE_BUCKET_REGION=${GARAGE_BUCKET_REGION:-garage}
      - SHOWS_DIR=/exports/shows
      - EXPORT_DIR=/exports
      # REL-05: expire recordings after 14 d and exports after 7 d by default
      # (override per var; unset env outside compose keeps retention disabled).
      - SHOW_AUDIO_RETENTION_DAYS=${SHOW_AUDIO_RETENTION_DAYS:-14}
      - EXPORT_RETENTION_DAYS=${EXPORT_RETENTION_DAYS:-7}
      - SESSION_STALE_HOURS=${SESSION_STALE_HOURS:-24}
      # REL-16/invariant 4: the fine-tuning corpus is KEEP-FOREVER unless you
      # opt in; enabling archives rows to AUDIT_ARCHIVE_DIR before deleting.
      - LLM_RETENTION_DAYS=${LLM_RETENTION_DAYS:-0}
      - AUDIT_ARCHIVE_DIR=${AUDIT_ARCHIVE_DIR:-/exports/audit_archive}
    volumes:
      - ../exports:/exports:rw
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: mcclanker/worker:latest
    env_file:
      - ../.env
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - WORKER_ID=worker-${HOSTNAME:-1}
      - DATABASE_URL=${DATABASE_URL:-postgresql://mcclanker:${POSTGRES_PASSWORD}@postgres:5432/mcclanker}
      - GARAGE_ENDPOINT=${GARAGE_ENDPOINT}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY}
      - GARAGE_BUCKET=${GARAGE_BUCKET}
      - GARAGE_BUCKET_REGION=${GARAGE_BUCKET_REGION:-garage}
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      # Review round-1 (P1): the worker's in-process cleanup loop also runs the
      # opt-in LLM corpus retention (LLM_RETENTION_DAYS via ../.env), so its
      # NDJSON archive destination MUST be durable storage. Bind the same host
      # dir the compose cleanup service's default lands in (one corpus
      # location) instead of ephemeral container storage; the worker stays
      # decoupled from the rest of audio storage (only this subdir is mounted).
      - AUDIT_ARCHIVE_DIR=${AUDIT_ARCHIVE_DIR:-/exports/audit_archive}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface:rw
      - ../exports/audit_archive:/exports/audit_archive:rw
    devices:
      - nvidia.com/gpu=all
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
