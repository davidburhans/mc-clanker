services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=mcclanker
      - POSTGRES_PASSWORD=change-me-in-production
      - POSTGRES_DB=mcclanker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcclanker"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  garage:
    image: debian-slim/garage:latest
    ports:
      - "3900:3900"
    volumes:
      - garage_data:/data
    command: server --data-dir /data --http-port 3900 --s3-port 3901
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3900/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: mcclanker/web:latest
    ports:
      - "7860:7860"
    environment:
      - LLM_BASE_URL=http://192.168.0.203:1234/v1
      - LLM_API_KEY=not-needed
      - LLM_MODEL=local-model
      - ICECAST_ENABLED=false
      - EXPORT_DIR=/exports
      - DISABLE_LOCAL_AUDIO=1
      - DATABASE_URL=postgresql://mcclanker:change-me-in-production@postgres:5432/mcclanker
      - JWT_SECRET=change-me-in-production-use-strong-secret
      - SHOWS_DIR=/exports/shows
      - GARAGE_ENDPOINT=http://garage:3900
      - GARAGE_ACCESS_KEY=GarageAccessKey
      - GARAGE_SECRET_KEY=GarageSecretKey
      - GARAGE_BUCKET=mcclanker
      - GARAGE_BUCKET_REGION=garage
    volumes:
      - ../exports:/exports:rw
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: mcclanker/worker:latest
    environment:
      - WORKER_ID=worker-${HOSTNAME:-1}
      - DATABASE_URL=postgresql://mcclanker:change-me-in-production@postgres:5432/mcclanker
      - GARAGE_ENDPOINT=http://garage:3900
      - GARAGE_ACCESS_KEY=GarageAccessKey
      - GARAGE_SECRET_KEY=GarageSecretKey
      - GARAGE_BUCKET=mcclanker
      - GARAGE_BUCKET_REGION=garage
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface:rw
    devices:
      - nvidia.com/gpu=all
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    deploy:
      replicas: 3
    restart: unless-stopped

  # Optional Icecast server for streaming output
  # Uncomment to enable web streaming
  # icecast:
  #   image: insomniaicecast/icecast
  #   ports:
  #     - "8001:8000"
  #   environment:
  #     - ICECAST_SOURCE_PASSWORD=sourcepass
  #     - ICECAST_ADMIN_PASSWORD=adminpass
  #     - ICECAST_MAX_SOURCES=10

volumes:
  postgres_data:
  redis_data:
  garage_data:
